<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>通用搜索验收页</title>
    <style>
      body { max-width: 920px; margin: 32px auto; font: 16px/1.6 Arial, sans-serif; color: #172033; }
      form { display: flex; gap: 10px; margin-bottom: 28px; }
      input { flex: 1; min-height: 38px; padding: 4px 10px; }
      button { min-width: 88px; cursor: pointer; }
      #b_results { padding: 0; list-style: none; }
      .b_algo { padding: 14px 0; border-bottom: 1px solid #e5e9f0; }
      .b_algo h2 { margin: 0 0 4px; font-size: 20px; }
    </style>
  </head>
  <body>
    <h1>通用搜索</h1>
    <form id="search-form" role="search">
      <input id="search-input" name="q" aria-label="搜索" placeholder="输入关键词" />
      <button id="search-button" type="submit">搜索</button>
    </form>
    <section id="home-hot-topics" aria-label="站点热点">
      <a href="/search.html?q=%E4%B8%8A%E6%B5%B7%E7%83%AD%E7%82%B9">上海热点</a>
      <a href="/search.html?q=LV%E5%85%AD%E5%BA%A6%E7%8A%B6%E5%91%8A%E5%9B%BD%E7%9F%A5%E5%B1%80">LV六度状告国知局</a>
      <a href="/search.html?q=%E5%B9%BC%E5%84%BF%E7%83%AD%E7%82%B9">幼儿热点</a>
    </section>
    <ol id="b_results"></ol>
    <script src="search.js"></script>
  </body>
</html>
